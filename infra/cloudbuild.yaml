# Google Cloud Build CI/CD Pipeline for Enterprise Healthcare Risk Assessment Platform
# Builds all 7 HIPAA Cloud Run container images in parallel, pushes to Artifact Registry,
# and deploys with least-privilege ingress rules.

substitutions:
  _REGION: us-central1
  _AR_REPO: healthcare-risk-platform
  _ENV: prod

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ===========================================================================
  # 1. Parallel Docker Builds (All 7 Cloud Run Services)
  # ===========================================================================
  - id: build-rules-engine-api
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - services/rules-engine-api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/rules-engine-api:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/rules-engine-api:latest
      - .

  - id: build-interop-ingestion-worker
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - services/interop-ingestion-worker/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/interop-ingestion-worker:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/interop-ingestion-worker:latest
      - .

  - id: build-clinical-parser-worker
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --build-arg
      - INSTALL_GCP_EXTRAS=true
      - -f
      - services/clinical-parser-worker/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/clinical-parser-worker:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/clinical-parser-worker:latest
      - .

  - id: build-patient-web
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - apps/patient-web/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/patient-web:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/patient-web:latest
      - .

  - id: build-patient-mobile-pwa
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - apps/patient-mobile-pwa/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/patient-mobile-pwa:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/patient-mobile-pwa:latest
      - .

  - id: build-provider-dashboard
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - apps/provider-dashboard/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/provider-dashboard:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/provider-dashboard:latest
      - .

  - id: build-admin-portal
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - apps/admin-portal/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/admin-portal:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/admin-portal:latest
      - .

  # ===========================================================================
  # 2. Push All 7 Images to Artifact Registry
  # ===========================================================================
  - id: push-images
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-rules-engine-api
      - build-interop-ingestion-worker
      - build-clinical-parser-worker
      - build-patient-web
      - build-patient-mobile-pwa
      - build-provider-dashboard
      - build-admin-portal
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        for svc in rules-engine-api interop-ingestion-worker clinical-parser-worker patient-web patient-mobile-pwa provider-dashboard admin-portal; do
          docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${svc}:${SHORT_SHA}"
          docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${svc}:latest"
        done

  # ===========================================================================
  # 3. Deploy Internal Backend Services First (VPC Internal Ingress Only)
  # ===========================================================================
  - id: deploy-backends
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-images]
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        for svc in rules-engine-api interop-ingestion-worker clinical-parser-worker; do
          gcloud run deploy "hrp-${_ENV}-${svc}" \
            --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${svc}:${SHORT_SHA}" \
            --region="${_REGION}" \
            --ingress=internal \
            --no-allow-unauthenticated \
            --quiet
        done

  # ===========================================================================
  # 4. Deploy Frontend Portals (Behind Cloud Armor WAF / Google IAP Load Balancer)
  # ===========================================================================
  - id: deploy-frontends
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [deploy-backends]
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        for svc in patient-web patient-mobile-pwa provider-dashboard admin-portal; do
          gcloud run deploy "hrp-${_ENV}-${svc}" \
            --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${svc}:${SHORT_SHA}" \
            --region="${_REGION}" \
            --ingress=internal-and-cloud-load-balancing \
            --quiet
        done

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/rules-engine-api:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/interop-ingestion-worker:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/clinical-parser-worker:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/patient-web:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/patient-mobile-pwa:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/provider-dashboard:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/admin-portal:${SHORT_SHA}
