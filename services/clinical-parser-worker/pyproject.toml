[project]
name = "clinical-parser-worker"
version = "0.1.0"
description = "Component 2: Python + Vertex AI Gemini structured clinical document parser with HIPAA provenance tracking"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.9.0",
  "psycopg[binary]>=3.2.0",
  "pypdf>=5.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
gcp = [
  "google-genai>=1.0.0",
  "google-cloud-documentai>=3.0.0",
  "google-cloud-storage>=2.18.0",
]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
